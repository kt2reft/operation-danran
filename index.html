<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>オペレーション・ダンラン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: full-bleed 3D stage; HUD pinned to the screen edges; menus as a sheet (bottom on phones, left rail on wide screens) */
  --ai:#121832;      /* 藍: base */
  --ai-2:#1c2550;    /* panel */
  --ai-3:#34407f;    /* line */
  --kami:#f4efe2;    /* 紙: text */
  --usu:#a3abd0;     /* muted text */
  --shu:#e8442e;     /* 朱: danger, brand */
  --yama:#f7b731;    /* 山吹: action, progress */
  --matsu:#3fb58a;   /* calm */
  --f-display:'Dela Gothic One','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ai);color:var(--kami);font-family:var(--f-body);font-weight:500;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--yama);outline-offset:2px}
.hidden{display:none!important}
#app{position:relative;height:100%;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* ---------- world labels ---------- */
.lb{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap;will-change:transform}
.hb{display:block;width:44px;height:7px;border-radius:4px;background:rgba(18,24,50,.8);overflow:hidden;border:1px solid rgba(244,239,226,.55)}
.hb b{display:block;height:100%;background:var(--matsu)}
.hb.w b{background:var(--yama)}
.hb.d b{background:var(--shu)}
.bub{--p:0;position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;font-size:19px;line-height:1;background:conic-gradient(var(--shu) calc(var(--p)*1%),var(--kami) 0);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.bub::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--kami)}
.bub span{position:relative}
.bub.late{animation:shake .22s infinite}
.bub.late::before{background:#ffd0c8}
.edge .bub{outline:3px solid var(--shu)}
.tag{font-size:10px;font-weight:900;letter-spacing:.06em;padding:2px 6px;border-radius:3px;background:rgba(18,24,50,.62);color:var(--kami)}
.tag.hot{background:var(--shu);animation:blink .5s infinite}
.ptag{font-size:10px;font-weight:900;padding:1px 6px;border-radius:4px;background:var(--pc);color:var(--ai);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.prompt{font-size:13px;font-weight:900;padding:5px 11px;border-radius:999px;background:var(--pc,var(--yama));color:var(--ai);box-shadow:0 3px 0 rgba(0,0,0,.4)}
.float{font-family:var(--f-display);font-size:17px;text-shadow:0 2px 0 var(--ai),0 0 6px var(--ai)}
.float.good{color:var(--yama)}
.float.bad{color:#ff9a8c}
@keyframes shake{0%,100%{margin-left:0}25%{margin-left:-3px}75%{margin-left:3px}}
@keyframes blink{50%{opacity:.35}}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:6px;padding:10px 12px}
.hud-top{pointer-events:auto;display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px;background:rgba(18,24,50,.86);border:2px solid var(--ai-3);border-radius:12px;padding:6px 10px}
.icon-btn{width:34px;height:34px;border-radius:8px;background:var(--ai-3);font-weight:900;font-size:14px}
.timer{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;line-height:1;min-width:66px}
.timer.low{color:var(--shu);animation:blink 1s infinite}
.goal{display:flex;flex-direction:column;gap:4px;min-width:0}
.goal>span:first-child{font-size:11px;font-weight:900;color:var(--usu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pips{display:flex;gap:3px}
.pips i{flex:1;max-width:30px;height:9px;border-radius:2px;background:var(--ai-3)}
.pips i.on{background:var(--yama)}
.score{text-align:right;font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums;line-height:1.1}
.score small{display:block;font-family:var(--f-body);font-size:10px;font-weight:900;color:var(--yama);min-height:12px}
.chips{display:flex;gap:6px}
.chips.many{flex-wrap:wrap}.chips.many .chip{flex:0 1 calc(25% - 5px);padding:3px 4px;column-gap:4px}.chips.many .nm{font-size:10px}.chips.many .av{transform:scale(.85)}
.nm small.pn{font-size:9px;font-weight:900;margin-left:3px}
.chip{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"av nm" "av bar" "rt rt";align-items:center;column-gap:6px;row-gap:2px;background:rgba(18,24,50,.86);border:2px solid var(--ai-3);border-radius:10px;padding:5px 6px}
.chip.w{border-color:var(--yama)}
.chip.d{border-color:var(--shu);animation:blink .6s infinite}
.chip.gone{opacity:.35}
.av{grid-area:av;position:relative;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--f-display);font-size:14px;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.av em{position:absolute;right:-7px;top:-7px;font-style:normal;font-size:14px}
.nm{grid-area:nm;font-size:11px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{grid-area:bar;height:6px;border-radius:3px;background:var(--ai-3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--matsu)}
.chip.w .bar i{background:var(--yama)}
.chip.d .bar i{background:var(--shu)}
.rt{grid-area:rt;display:none;font-size:11px;font-weight:700;color:var(--usu);min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toasts{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.toast{font-size:12.5px;font-weight:700;line-height:1.35;background:rgba(244,239,226,.96);color:var(--ai);padding:5px 10px;border-radius:6px;border-left:5px solid var(--yama);animation:toast 3.6s forwards;max-width:100%}
.toast.warn{border-left-color:var(--shu)}
@keyframes toast{0%{opacity:0;transform:translateX(-12px)}6%,86%{opacity:1;transform:none}100%{opacity:0}}

.pcards{position:absolute;left:14px;bottom:16px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 230px)}
body.touch.solo .pcards{display:none}
body.touch .pcards{bottom:auto;top:150px;max-width:calc(100% - 28px)}
.pcard{display:flex;flex-direction:column;gap:2px;min-width:150px;padding:6px 10px;border-radius:9px;background:rgba(18,24,50,.86);border:2px solid var(--ai-3);border-left:6px solid var(--pc)}
.pcard b{font-size:12.5px;font-weight:900}
.pcard .st{display:flex;gap:10px;font-size:11.5px;font-weight:700;min-height:16px}
.pcard .cd{color:var(--matsu)}
.pcard .cd.wait{color:var(--usu)}
.pcard .kh{font-size:10px;font-weight:700;color:var(--usu)}

.pad{pointer-events:none;position:absolute;right:14px;bottom:18px;width:180px;height:176px}
.pad-btn{pointer-events:auto;touch-action:none;position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;line-height:1.15;font-weight:900;border:3px solid var(--kami);box-shadow:0 4px 0 rgba(0,0,0,.4)}
.pad-btn:active,.pad-btn.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.pad-btn b{font-size:12px;padding:0 6px}
.pad-btn .k{display:none;font-size:9px;font-weight:700;opacity:.75;letter-spacing:.05em}
body:not(.touch) .pad-btn .k{display:block}
.act{right:0;bottom:0;width:100px;height:100px;background:var(--yama);color:var(--ai)}
.act.idle{background:var(--ai-2);color:var(--usu);border-color:var(--ai-3)}
.dash{right:108px;bottom:2px;width:66px;height:66px;background:var(--ai-2)}
.dash.on{background:var(--shu)}
.skill{right:10px;bottom:108px;width:68px;height:68px;background:var(--matsu);color:var(--ai)}
.skill.cd{background:var(--ai-2);color:var(--usu);border-color:var(--ai-3)}
.skill i{font-style:normal;font-family:var(--f-display);font-size:13px}
body.padp1 .pad{display:none}
#joy{pointer-events:auto;touch-action:none;position:absolute;left:0;bottom:0;width:52%;height:48%;display:none}
body.touch #joy{display:block}
body.touch.padp1 #joy{display:none}
#joy-base{position:absolute;left:26px;bottom:30px;width:112px;height:112px;border-radius:50%;border:2px solid rgba(244,239,226,.4);background:rgba(18,24,50,.4)}
#joy-knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(244,239,226,.85)}

#banner{position:absolute;left:0;right:0;top:26%;pointer-events:none;text-align:center;padding:0 16px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
#banner-main{font-family:var(--f-display);font-size:clamp(34px,11vw,76px);line-height:1.05;color:var(--kami);text-shadow:4px 4px 0 var(--shu),0 0 18px var(--ai);text-wrap:balance}
#banner-sub{display:inline-block;margin-top:10px;font-size:14px;font-weight:900;background:var(--ai);border:2px solid var(--yama);border-radius:999px;padding:5px 14px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
#flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0}
#flash.go{animation:flash .5s}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
#scr-title{background:linear-gradient(180deg,rgba(18,24,50,.55) 0,rgba(18,24,50,0) 26%,rgba(18,24,50,0) 34%,rgba(18,24,50,.85) 44%)}
.logo{padding:16px 18px 0;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.logo .op{font-size:11px;letter-spacing:.32em;font-weight:900;color:var(--yama)}
.logo h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,8.6vw,42px);line-height:1.08;text-shadow:3px 3px 0 var(--shu)}
.logo .tagline{font-size:13px;font-weight:900;text-shadow:0 1px 4px var(--ai)}
.sheet{margin-top:auto;background:var(--ai);border-top:3px solid var(--shu);border-radius:18px 18px 0 0;padding:14px 16px 0;display:flex;flex-direction:column;gap:12px;max-height:66%;overflow-y:auto;touch-action:pan-y}
.sheet h2{font-size:13px;font-weight:900;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.sheet h2 small{font-size:11px;font-weight:700;color:var(--usu)}
.char-list{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.char-btn{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;border-radius:10px;border:2px solid var(--ai-3);background:var(--ai-2)}
.char-btn .av{width:40px;height:40px;font-size:20px}
.char-btn span.n{font-size:12px;font-weight:900}
.char-btn span.s{font-size:9px;color:var(--yama);letter-spacing:.05em}
.char-btn[aria-pressed="true"]{border-color:var(--yama);background:var(--ai-3)}
.char-btn .who{position:absolute;top:3px;right:3px;font-size:9px;font-weight:900;padding:1px 4px;border-radius:4px;background:var(--pc);color:var(--ai)}
.char-detail{display:flex;flex-direction:column;gap:8px;background:var(--ai-2);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.char-detail .stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-weight:700}
.char-detail .stats b{color:var(--usu);font-weight:700;margin-right:4px}
.char-detail .sk{font-weight:700}
.char-detail .sk strong{color:var(--yama);font-weight:900;margin-right:6px}
.foes{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;border-top:1px solid var(--ai-3);padding-top:8px}
.foes li{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;min-width:0}
.foes .av{width:20px;height:20px;font-size:11px;flex:none}
.foes-h{font-size:11px;font-weight:900;color:var(--usu)}
.party{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:flex;align-items:center;border-radius:9px;background:var(--ai-2);border:2px solid var(--ai-3)}
.pchip.sel{border-color:var(--pc)}
.pchip .pick{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:12px;font-weight:900}
.pchip .pn{display:grid;place-items:center;min-width:24px;height:20px;padding:0 4px;border-radius:5px;background:var(--pc);color:var(--ai);font-size:11px}
.pchip small{font-size:10px;color:var(--usu);font-weight:700}
.pchip .x{width:26px;align-self:stretch;border-left:1px solid var(--ai-3);font-size:13px;color:var(--usu)}
.join-hint{font-size:11px;font-weight:700;color:var(--usu);line-height:1.5}
.stage-list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stage-btn{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:8px 9px;border-radius:10px;border:2px solid var(--ai-3);background:var(--ai-2)}
.stage-btn .n{font-size:12.5px;font-weight:900}
.stage-btn .t{font-size:10.5px;color:var(--usu);font-weight:700;font-variant-numeric:tabular-nums}
.stage-btn[aria-pressed="true"]{border-color:var(--yama);background:var(--ai-3)}
.stage-btn:disabled{cursor:default}
.stage-brief{font-size:12.5px;font-weight:700;line-height:1.5}
.rules{list-style:none;display:flex;flex-direction:column;gap:3px;font-size:11.5px;line-height:1.5;color:var(--usu);font-weight:700}
.rules li{padding-left:12px;position:relative}
.rules li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:2px;background:var(--shu)}
.online{display:flex;flex-direction:column;gap:8px;background:var(--ai-2);border-radius:10px;padding:10px 12px}
.online p{font-size:12px;font-weight:700;color:var(--usu);line-height:1.5}
.online p.err{color:#ff9a8c}
.online .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:700}
.online .code{font-family:var(--f-display);font-size:22px;letter-spacing:.14em;color:var(--yama)}
.online input{flex:1;min-width:0;font:inherit;font-size:14px;font-weight:900;letter-spacing:.12em;padding:7px 10px;border-radius:8px;border:2px solid var(--ai-3);background:var(--ai);color:var(--kami);-webkit-user-select:text;user-select:text}
.online input:focus-visible{outline:3px solid var(--yama);outline-offset:1px}
.online #invite-url{font-size:11px;letter-spacing:0;font-weight:700;color:var(--usu)}
.room-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.room-list li{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
.room-list li span{flex:1;min-width:0}
.sbtn{font-size:12.5px;font-weight:900;padding:7px 12px;border-radius:8px;background:var(--yama);color:var(--ai)}
.sbtn.alt{background:var(--ai-3);color:var(--kami)}
.sbtn:disabled{opacity:.45;cursor:default}
.start-note{font-size:12px;font-weight:700;color:#ff9a8c}
.cta-wrap{position:sticky;bottom:0;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,transparent,var(--ai) 30%);padding:10px 0 14px}
.cta{width:100%;font-family:var(--f-display);font-size:20px;padding:13px;border-radius:12px;background:var(--shu);color:#fff;box-shadow:0 5px 0 #8f2418}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 #8f2418}
.cta:disabled{background:var(--ai-3);color:var(--usu);box-shadow:none;font-size:15px;cursor:default;transform:none}
.ghost{width:100%;font-weight:900;font-size:14px;padding:11px;border-radius:12px;border:2px solid var(--ai-3);background:var(--ai-2)}
.ghost:disabled{opacity:.5;cursor:default}

#scr-pause,#scr-result{background:rgba(18,24,50,.88);align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:420px;max-height:100%;overflow-y:auto;touch-action:pan-y;background:var(--ai-2);border:2px solid var(--ai-3);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--f-display);font-weight:400;font-size:22px}
.card .note{font-size:12px;font-weight:700;color:var(--usu)}
.rank-row{display:flex;align-items:center;gap:14px}
.rank{flex:none;display:grid;place-items:center;width:84px;height:84px;border-radius:50%;border:5px solid var(--yama);color:var(--yama);font-family:var(--f-display);font-size:46px;line-height:1;transform:rotate(-8deg)}
.rank.over{border-color:var(--shu);color:var(--shu)}
.rank-row h2{text-wrap:balance}
.rank-row p{font-size:12.5px;font-weight:700;color:var(--usu);line-height:1.5}
.bd{width:100%;border-collapse:collapse;font-size:13px;font-weight:700}
.bd td{padding:4px 0;border-bottom:1px solid var(--ai-3)}
.bd td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.bd tr.total td{border-bottom:0;font-family:var(--f-display);font-size:20px;padding-top:8px}
.ps{width:100%;border-collapse:collapse;font-size:12px;font-weight:700}
.ps th{font-size:10.5px;color:var(--usu);font-weight:700;text-align:right;padding:2px 0}
.ps th:first-child,.ps td:first-child{text-align:left}
.ps td{padding:3px 0;text-align:right;font-variant-numeric:tabular-nums}
.ps .pn{display:inline-block;min-width:22px;padding:0 4px;margin-right:6px;border-radius:4px;background:var(--pc);color:var(--ai);text-align:center;font-size:10.5px}
.awards{display:flex;flex-wrap:wrap;gap:6px}
.awards span{font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;background:var(--ai-3)}
.best{font-size:12px;font-weight:700;color:var(--usu)}
#fatal{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--ai);font-weight:700;line-height:1.7}

@media (min-width:860px){
  #scr-title{right:auto;width:470px;background:linear-gradient(90deg,var(--ai) 0,var(--ai) 82%,rgba(18,24,50,0))}
  .logo{padding:26px 28px 0}
  .sheet{max-height:none;flex:1;margin-top:14px;border-top:0;border-radius:0;background:none;padding:0 60px 0 28px}
  .cta-wrap{background:none}
  #hud{padding:14px 16px}
  .hud-top{width:min(560px,60%);}
  .chips{position:absolute;right:16px;top:14px;flex-direction:column;width:230px}
  .chips.many{flex-wrap:nowrap;width:210px}.chips.many .chip{flex:none}.chips.many .rt{display:none}
  .chip{flex:none}
  .rt{display:block}
  .toasts{max-width:520px}
  .toast{font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  .timer.low,.chip.d,.tag.hot,.bub.late,#banner,#flash.go{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <button id="btn-pause" class="icon-btn" type="button" aria-label="メニュー">II</button>
      <div class="timer" id="timer">3:00</div>
      <div class="goal"><span id="goal-name">夕飯の配膳</span><span class="pips" id="pips"></span></div>
      <div class="score"><span id="score">0</span><small id="combo"></small></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div id="joy"><div id="joy-base"><div id="joy-knob"></div></div></div>
    <div class="pcards" id="pcards"></div>
    <div class="pad">
      <button id="btn-skill" class="pad-btn skill" type="button"><span class="k">Q</span><b id="skill-name">スキル</b><i id="skill-cd"></i></button>
      <button id="btn-dash" class="pad-btn dash" type="button"><span class="k">Shift</span><b>ダッシュ</b></button>
      <button id="btn-act" class="pad-btn act idle" type="button"><span class="k">Space</span><b id="act-name">行動</b></button>
    </div>
  </div>

const boxes=[],circles=[];
function solid(x0,z0,x1,z1,wall){boxes.push({x0,z0,x1,z1,wall:!!wall});}
const CS=.5,GX=40,GZ=28,blocked=new Uint8Array(GX*GZ);
function isFree(x,z,r){
  if(x<-10+r||x>10-r||z<-7+r||z>7-r)return false;

  return true;

function buildGrid(){for(let j=0;j<GZ;j++)for(let i=0;i<GX;i++)blocked[j*GX+i]=isFree(-10+(i+.5)*CS,-7+(j+.5)*CS,.3)?0:1;}

  const c=cellAt(x,z);if(!blocked[c])return c;

  for(let r=1;r<8&&best<0;r++)for(let j=cj-r;j<=cj+r;j++)for(let i=ci-r;i<=ci+r;i++){
    if(i<0||j<0||i>=GX||j>=GZ||blocked[j*GX+i])continue;const d=dist(x,z,cellX(i),cellZ(j));if(d<bd){bd=d;best=j*GX+i;}}
  return best;
}

  const d=dist(ax,az,bx,bz),n=Math.max(1,Math.ceil(d/.2));
  for(let k=0;k<=n;k++){const t=k/n;if(blocked[cellAt(lerp(ax,bx,t),lerp(az,bz,t))])return false;}
  return true;
}
function findPath(sx,sz,tx,tz){
  const s=nearestFree(sx,sz),t=nearestFree(tx,tz);
  if(s<0||t<0||s===t)return[{x:tx,z:tz}];

    let bi=0;for(let k=1;k<open.length;k++)if(f[open[k]]<f[open[bi]])bi=k;
    const cur=open[bi];open[bi]=open[open.length-1];open.pop();
    if(cur===t){found=true;break;}
    if(closed[cur])continue;closed[cur]=1;
    const ci=cur%GX,cj=(cur/GX)|0;
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){
      if(!di&&!dj)continue;const ni=ci+di,nj=cj+dj;if(ni<0||nj<0||ni>=GX||nj>=GZ)continue;
      const nc=nj*GX+ni;if(blocked[nc]||closed[nc])continue;
      if(di&&dj&&(blocked[cj*GX+ni]||blocked[nj*GX+ci]))continue;
      const ng=g[cur]+(di&&dj?1.41:1);if(ng<g[nc]){g[nc]=ng;f[nc]=ng+h(nc);came[nc]=cur;open.push(nc);}
    }
  }

  const pts=[];for(let c=t;c!==-1;c=came[c])pts.push({x:cellX(c%GX),z:cellZ((c/GX)|0)});
  pts.reverse();
  if(isFree(tx,tz,.2)&&gridLos(pts[pts.length-1].x,pts[pts.length-1].z,tx,tz))pts.push({x:tx,z:tz});
  const out=[];let ax=sx,az=sz,i=0;                       // string-pull
  while(i<pts.length){let j=pts.length-1;while(j>i&&!gridLos(ax,az,pts[j].x,pts[j].z))j--;out.push(pts[j]);ax=pts[j].x;az=pts[j].z;i=j+1;}
  return out;
}
function sightClear(ax,az,bx,bz){                            // walls only: furniture is low

    return false;}

}

    if(k>=1){p.s.visible=false;FX.pool.push(p.s);FX.live.splice(i,1);continue;}
    p.vy-=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.y<.05){p.y=.05;p.vy*=-.4;}
    p.s.position.set(p.x,p.y,p.z);const sc=lerp(p.s0,p.s1,k);p.s.scale.set(sc,sc,1);p.s.material.opacity=1-k*k;}
  for(const r of FX.rings){if(r.t>=r.life){r.m.visible=false;continue;}r.t+=dt;const k=Math.min(1,r.t/r.life),s=lerp(.3,r.R,k);r.m.scale.set(s,s,1);r.m.material.opacity=.7*(1-k);}
}

/* ---------- party (who plays on this screen) ---------- */
function curSlots(){
  if(NET.mode==='guest'){
    const sl=NET.lob?NET.lob.sl:[];
    return sl.map(e=>({char:e[1],kind:e[0]&&e[0]===NET.myPeer?'me':e[0]?'net':'host',peer:e[0]}));
  }
  const out=PARTY.map((p,i)=>({char:p.char,kind:'local',dev:p.dev,li:i,peer:''}));
  if(NET.mode==='host'){const used=new Set(out.map(s=>s.char));
    for(const g of NET.guests){if(out.length>=4){g.char='';continue;}
      let c=g.want;if(!ORDER.includes(c)||used.has(c))c=(g.char&&!used.has(g.char))?g.char:ORDER.find(o=>!used.has(o));
      g.char=c;used.add(c);out.push({char:c,kind:'net',peer:g.peer});}}
  return out;
}
function devLabel(d){if(d==='kb')return isTouch()?'タッチ':'キーボード';if(d==='kb2')return'キーボード右';return'コントローラー'+(+d.slice(1)+1);}
function keyHint(d){
  if(d==='kb')return isTouch()?'画面のスティックとボタン':PARTY.some(p=>p.dev==='kb2')||(G.locals||[]).some(p=>p.dev==='kb2')?'WASD 移動・Space 行動・Shift 走る・Q スキル':'WASD/矢印 移動・Space 行動・Shift 走る・Q スキル';
  if(d==='kb2')return'矢印 移動・. 行動・/ 走る・, スキル';
  return'スティック 移動・A 行動・B 走る・X スキル';
}
function note(t){const n=$('#start-note');n.textContent=t||'';n.classList.toggle('hidden',!t);}
function joinLocal(dev){
  if(NET.mode==='guest'){PARTY[0].dev=dev;renderMenu();SFX_RAW.pick();return;}
  if(PARTY.some(p=>p.dev===dev))return;
  if(PARTY.length===1&&PARTY[0].dev==='kb'&&!kbUsed&&dev[0]==='p'){PARTY[0].dev=dev;renderMenu();SFX_RAW.give();return;}
  const slots=curSlots();if(slots.length>=4){note('参加できるのは4人までです');return;}
  const used=new Set(slots.map(s=>s.char));PARTY.push({dev,char:ORDER.find(o=>!used.has(o))});

function leaveLocal(li){if(NET.mode==='guest'||PARTY.length<=1||!PARTY[li])return;PARTY.splice(li,1);SEL.slot=Math.min(SEL.slot,PARTY.length-1);renderMenu();SFX_RAW.pick();}

  if(!ORDER.includes(c))return;

  const other=PARTY.findIndex((p,i)=>i!==li&&p.char===c);
  if(other>=0)PARTY[other].char=PARTY[li].char;
  PARTY[li].char=c;renderMenu();
}
function cycleChar(li,dir){
  const guest=NET.mode==='guest',slots=curSlots();
  const taken=new Set(slots.filter(s=>guest?s.kind!=='me':!(s.kind==='local'&&s.li===li)).map(s=>s.char));
  const meSlot=guest&&slots.find(s=>s.kind==='me');
  let i=ORDER.indexOf(guest?(meSlot?meSlot.char:PARTY[0].char):PARTY[li].char);
  for(let k=0;k<5;k++){i=(i+dir+5)%5;if(!taken.has(ORDER[i])){setChar(li,ORDER[i]);SFX_RAW.tick();return;}}
}

    stoves:P.stoves.map(s=>({x:s.x,z:s.z,state:'idle',t:0})),routerDown:false,distract:0,evT:rand(14,18),argCd:{},argTick:0,argNext:16,combo:0,lastGain:-99,
    stats:{tasks:0,noise:0,calm:0,near:0,maxHate:0},bd:{main:0,sub:0,calm:0,pen:0,bonus:0},wash:{occ:null,queue:[]},toilet:{occ:null},seatI:0,
    guest:null,byId:{},hints:{},lastTick:99,heat:0,bodies:[],camShake:0,rs:null,res:null,itemKey:'',trapKey:'',dishKey:'',resT:0};

  G.pace=1+.45*(n-1);G.hateMul=1+.35*(n-1);G.cookT=isP('mom')?4:6;G.multi=n>1;G.famT=rand(16,22);G.fam=[];
  const roster=ORDER.concat(morning&&n>1?RELATIVES.slice(0,n):[]);        // morning: a relative sleeps over for every extra player
  roster.forEach(id=>{const si=cfg.ch.indexOf(id),a=newActor(id,si>=0);G.actors.push(a);G.byId[id]=a;
    if(si<0){G.npcs.push(a);return;}

    G.players.push(a);});
  G.players.sort((a,b)=>a.slot-b.slot);G.locals=G.players.filter(p=>p.ctrl==='local');G.player=G.locals[0]||G.players[0];
  const OFF=[[0,0],[1.2,0],[-1.2,0],[0,1]];
  G.players.forEach(p=>place(p,{x:P.start.x+OFF[p.slot][0],z:P.start.z+OFF[p.slot][1]},Math.PI));
  let wake=0;const order=roster.filter(i=>i!=='cat'&&!isP(i)).sort(()=>Math.random()-.5);
  for(const c of G.npcs){

    else if(c.id==='bro'){place(c,P.broSeat,Math.PI);c.sit=true;c.state='pc';c.types=['router'];c.nextReq=rand(22,30);}

    else if(c.id==='cat'){place(c,{x:-6,z:5.2},1);c.state='zoom';c.types=['pet'];c.nextReq=rand(18,26);}

  }

    G.players.forEach(p=>{p.types=morning?[]:HT[p.id];p.nextReq=rand(20,30);p.mis=rand(14,22);p.state='idle';
      if(p.id==='mom')addRing(p);if(p.id==='sis')addCone(p);});
  }
  G.fam=G.npcs.concat(G.multi?G.players:[]);
  G.players.forEach(p=>{const c=new THREE.Color(PCOL[p.slot]).getHex(),r=flat(new THREE.RingGeometry(.42,.54,32),c,.9);r.position.y=.05;p.m.g.add(r);});
  G.actors.forEach(a=>{a.tx=a.x;a.tz=a.z;a.trot=a.rot;});
  buildChips();buildPcards();
  hideOverlays();$('#scr-title').classList.add('hidden');$('#hud').classList.remove('hidden');

  bannerL(st.name,morning?`家族${G.goal}人を送り出せ`:G.stage==='guest'?`来客に${G.goal}品もてなせ`:`ちゃぶ台へ${G.goal}皿運べ`,2400);
  const devs=G.locals.map(p=>p.dev);
  toastL(devs.some(d=>d[0]==='p')?'スティックで移動、Aで行動、Bでダッシュ、Xでスキル':isTouch()?'左のスティックで移動、右のボタンで行動':'WASDで移動、Spaceで行動、Shiftでダッシュ、Qでスキル');
  if(n>1)toastL(G.locals.length>1?'足元の色の輪が自分のキャラ。行動ボタンの吹き出しにもP番号が出る':`あなたは P${G.player.slot+1}（${G.player.def.name}）。足元の色の輪が目印`);
  SFX_RAW.give();
  NET.quiet--;
}

/* ---------- feedback helpers (L = this screen only; plain = also sent to online guests) ---------- */
function addHate(n,v){n.hate=clamp(n.hate+v,0,100);if(n.hate>G.stats.maxHate)G.stats.maxHate=n.hate;}
function gain(v,cat,x,z,text){
  if(v>0){G.combo=(G.time-G.lastGain<10)?Math.min(G.combo+1,5):1;G.lastGain=G.time;const pts=Math.round(v*(1+.2*(G.combo-1)));G.score+=pts;G.bd[cat]+=pts;
    floatText(x,z,`+${pts}${G.combo>1?' ×'+G.combo:''}`,'good');}
  else{G.score=Math.max(0,G.score+v);G.bd.pen+=v;G.combo=0;floatText(x,z,`${v} ${text||''}`,'bad');}
}
function floatL(x,z,text,cls){G.floats.push({x,z,text,cls,t:0});}
function floatText(x,z,text,cls){floatL(x,z,text,cls);netEv(['f',r2(x),r2(z),text,cls]);}
function toastL(text,kind){
  const box=$('#toasts'),el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.textContent=text;box.appendChild(el);
  while(box.children.length>3)box.removeChild(box.firstChild);setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},3600);
}
function toast(text,kind){toastL(text,kind);netEv(['t',text,kind||'']);}
let bannerTimer=0;
function bannerL(main,sub,ms){
  const b=$('#banner');$('#banner-main').textContent=main;$('#banner-sub').textContent=sub||'';$('#banner-sub').classList.toggle('hidden',!sub);
  b.classList.add('hidden');void b.offsetWidth;b.classList.remove('hidden');clearTimeout(bannerTimer);if(ms)bannerTimer=setTimeout(()=>b.classList.add('hidden'),ms);
}
function hint(key,text,kind){if(G.hints[key])return;G.hints[key]=1;toast(text,kind);}
const pTag=p=>G.players.length>1?`P${p.slot+1}`:'';
function task(p){G.stats.tasks++;if(p)p.st.tasks++;}
function calmBy(p){G.stats.calm++;if(p)p.st.calm++;}
function rumble(dev,ms,s){if(!dev||dev[0]!=='p')return;const st=PADS.cur[+dev.slice(1)],va=st&&st.pad&&st.pad.vibrationActuator;if(va&&va.playEffect)try{const r=va.playEffect('dual-rumble',{duration:ms,strongMagnitude:s||.6,weakMagnitude:.4});if(r&&r.catch)r.catch(()=>{});}catch(e){}}
function goTo(n,x,z){n.path=findPath(n.x,n.z,x,z);n.pi=0;}
function moveAlong(n,dt,sp){
  if(!n.path)return true;const w=n.path[n.pi],dx=w.x-n.x,dz=w.z-n.z,d=Math.hypot(dx,dz),step=sp*dt;
  if(d<=step){n.x=w.x;n.z=w.z;n.pi++;if(n.pi>=n.path.length){n.path=null;return true;}}
  else{n.x+=dx/d*step;n.z+=dz/d*step;n.rot=rotTo(n.rot,Math.atan2(dx,dz),dt*10);}
  n.moving=sp;return false;
}
const heldCode=h=>h.type==='dish'?'d':h.type==='beer'?'b':String(Math.max(0,EVID.indexOf(h.kind)));
function parseHeld(s){const out=[];for(const ch of s){if(ch==='d')out.push({type:'dish'});else if(ch==='b')out.push({type:'beer'});else if(EVID[+ch])out.push({type:'evidence',kind:EVID[+ch]});}return out;}
function refreshHeld(p){
  const mt=p.m.mount;while(mt.children.length){const c=mt.children[0];mt.remove(c);c.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});}
  p.held.forEach((h,i)=>{const it=makeItem(h.type,h.kind);it.position.y=i*.24;if(p.m.isCat)it.scale.set(.75,.75,.75);mt.add(it);});
  p.heldKey=p.held.map(heldCode).join('');
}
function giveItem(p,type,kind){p.held.push({type,kind});refreshHeld(p);SFX.pick();}
function takeItem(p,type){const i=p.held.findIndex(h=>h.type===type);if(i<0)return null;const h=p.held.splice(i,1)[0];refreshHeld(p);return h;}
function tableDish(x,z,y){const d=makeItem('dish');d.position.set(x,y||.47,z);scene.add(d);G.dishes.push(d);}

/* ---------- requests ---------- */
function reqInterval(){return rand(20,30)*lerp(1,.65,clamp(G.time/G.st.time,0,1))/G.pace;}
function startReq(n,type){
  if(type==='router'){if(G.routerDown){n.nextReq=G.time+6;return;}G.routerDown=true;}
  n.req={type,t:0,pat:REQ[type].pat*(n.isPlayer?1.25:1),warned:false};toast(REQ[type].line(n.isPlayer?`${n.def.name}（${pTag(n)}）`:n.def.name));SFX.req();
}
function fulfil(n,p){
  if(!n.req)return;const t=n.req.type,self=n===p;n.req=null;n.nextReq=G.time+reqInterval();addHate(n,self?-8:-12);if(!self){task(p);gain(250,'sub',n.x,n.z);}SFX.give();
  if(t==='router')G.routerDown=false;
  if(t==='pet')burst(n.x,.8,n.z,'heart',6);
  if(t==='breakfast'){const dx=P.table.x-n.x,dz=P.table.z-n.z,d=Math.hypot(dx,dz)||1;tableDish(n.x+dx/d*1.05,n.z+dz/d*1.05);}
}

/* ---------- arguments ---------- */
function canArgue(n){return!n.gone&&n.id!=='guest'&&n.frozen<=0&&n.stun<=0&&!n.arguing&&n.spotT<=0&&!['sleep','wash','toilet','eat','seated'].includes(n.state);}
function startArgue(a,b,why,tag){
  a.arguing=b;b.arguing=a;a.argT=b.argT=0;G.argCd[a.id+b.id]=G.argCd[b.id+a.id]=G.time+26;
  toast(`${tag||''}${a.def.name}と${b.def.name}が${why}口論を始めた。近づいて仲裁しよう`,'warn');SFX.alarm();
}
function checkArguments(dt){
  G.argTick-=dt;if(G.argTick>0||G.time<G.argNext)return;G.argTick=.5;
  const L=G.fam;
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){
    const a=L[i],b=L[j];if(!canArgue(a)||!canArgue(b)||dist(a.x,a.z,b.x,b.z)>2)continue;
    const r=relOf(a,b);
    if((G.argCd[a.id+b.id]||0)>G.time||Math.random()>.1*(G.multi?r[0]:1))continue;
    G.argNext=G.time+(G.multi?11/(1+.25*(G.players.length-1)):11);startArgue(a,b,r[1]);return;
  }
}
function endArgue(a,p){
  const b=a.arguing;if(!b)return;a.arguing=b.arguing=null;G.argCd[a.id+b.id]=G.argCd[b.id+a.id]=G.time+26;
  if(p){addHate(a,-6);addHate(b,-6);calmBy(p);gain(100,'calm',(a.x+b.x)/2,(a.z+b.z)/2);SFX.give();toast(`${pTag(p)}${pTag(p)?'が':''}仲裁成功`);}
  else if(G.multi&&a.argT>=10){                                    // nobody stepped in: it spreads to whoever is standing close
    addHate(a,6);addHate(b,6);
    const near=G.fam.filter(c=>c!==a&&c!==b&&canArgue(c)&&(dist(c.x,c.z,a.x,a.z)<4.5||dist(c.x,c.z,b.x,b.z)<4.5));
    if(near.length&&Math.random()<.6){const c=pick(near),x=pick([a,b]);if(canArgue(x)){G.argNext=G.time+8;startArgue(x,c,relOf(x,c)[1],'飛び火！　');}}
  }
}
/* family incidents (multiplayer): every extra player is also a family member, so the household keeps flaring up on its own */
function famEvent(){
  const L=G.fam.filter(canArgue);if(L.length<2)return;
  if(G.byId.bro&&canArgue(G.byId.bro)&&Math.random()<.25){const b=G.byId.bro;toast('長男「ボリューム全開でゲーム中」 家中に爆音が響く','warn');emitNoise(b.x,b.z,3,null);return;}
  let best=null,bw=-1;
  for(let k=0;k<8;k++){const a=pick(L),b=pick(L);if(a===b||(G.argCd[a.id+b.id]||0)>G.time)continue;const w=relOf(a,b)[0]*(.6+Math.random());if(w>bw){bw=w;best=[a,b];}}
  if(best)startArgue(best[0],best[1],relOf(best[0],best[1])[1],'家族会議！　');
}
function famTick(dt){
  if(!G.multi)return;
  G.famT-=dt;if(G.famT<=0){G.famT=rand(18,26)/(1+.4*(G.players.length-1));famEvent();}
  for(const a of G.fam){if(!a.arguing||a.gone)continue;                  // bystanders get dragged in
    for(const c of G.fam){if(c===a||c===a.arguing||c.arguing||c.gone||c.id==='guest')continue;if(dist(c.x,c.z,a.x,a.z)<3.5)addHate(c,.55*dt);}}
}
/* ---------- the human family members keep their own quirks ---------- */
function updateHumanFam(p,dt){
  p.hearCd=Math.max(0,p.hearCd-dt);p.ringFlash=Math.max(0,p.ringFlash-dt);
  addHate(p,.17*G.hateMul*dt);
  if(p.arguing){p.argT+=dt;addHate(p,2.6*dt);if(p.argT>10)endArgue(p,null);return;}
  if(p.req){p.req.t+=dt;const late=p.req.t>p.req.pat;addHate(p,(late?3:1)*G.hateMul*dt);
    if(late&&!p.req.warned){p.req.warned=true;toast(`${p.def.name}（${pTag(p)}）が限界寸前。${REQ[p.req.type].text}を急げ`,'warn');SFX.alarm();}}
  else if(p.types.length&&G.time>=p.nextReq)startReq(p,pick(p.types));
  if(p.id==='cat'){p.mis-=dt;if(p.mis<=0){p.mis=rand(16,24);if(!blocked[cellAt(p.x,p.z)]){
    if(Math.random()<.5)spawnTrap(p.x,p.z);else spawnEvidence(p.x,p.z);toast(`${pTag(p)}猫のいたずら。足元に何か落ちた`,'warn');}}}
}

/* ---------- evidence & traps ---------- */
function spawnEvidence(x,z){
  if(G.items.length>=3)return;const kind=pick(EVID),mesh=makeItem('evidence',kind);mesh.position.set(x,.02,z);mesh.rotation.y=rand(0,TAU);scene.add(mesh);
  G.items.push({x,z,kind,mesh});
  if(G.hints.ev)toast(`床に「${kind.name}」が落ちた`);else hint('ev',`床に「${kind.name}」が落ちた。見つかる前にゴミ箱で証拠隠滅しよう`,'warn');
}
function removeEvidence(e){const i=G.items.indexOf(e);if(i>=0)G.items.splice(i,1);drop(e.mesh);}
function spawnTrap(x,z){
  if(G.traps.length>=3)return;const mesh=makeTrap();mesh.position.set(x,0,z);scene.add(mesh);
  G.traps.push({x,z,mesh,t:40});
}
function emitNoise(x,z,loud,p){
  if(loud)rippleN(x,z,5,0xff5a36);
  const mom=G.byId.mom;if(!mom||mom.gone||mom.frozen>0||G.distract>0||mom.hearCd>0||(mom.isPlayer&&(!G.multi||p===mom)))return;
  if(dist(mom.x,mom.z,x,z)>3+loud)return;
  mom.hearCd=1.5;mom.ringFlash=.7;addHate(mom,mom.isPlayer?7:10);G.stats.noise++;if(p)p.st.noise++;gain(-50,'pen',mom.x,mom.z,'騒音');SFX.bad();
  toast(mom.isPlayer?`母（${pTag(mom)}）「誰！ドタバタしてるのは！」`:'母「誰！ドタバタしてるのは！」','warn');
  if(!mom.isPlayer&&(mom.state==='patrol'||mom.state==='investigate')){mom.state='investigate';goTo(mom,x,z);}
}

/* ---------- players ---------- */
function calcInGuest(p){const g=G.guest;return!!(g&&g.frozen<=0&&G.distract<=0&&inCone(g.x,g.z,g.look,p.x,p.z,6,.6)&&sightClear(g.x,g.z,p.x,p.z));}
function moveLocal(p,inp,dt){                                  // movement on the machine that owns the player
  let ix=inp.x,iz=inp.z;const mag=Math.hypot(ix,iz);if(mag>1){ix/=mag;iz/=mag;}
  p.moving=0;p.dashing=false;
  if(p.stun>0){p.rot+=dt*14;return;}
  if(p.arguing&&G.multi){const o=p.arguing;p.rot=rotTo(p.rot,Math.atan2(o.x-p.x,o.z-p.z),dt*8);return;}   // caught up in a family quarrel
  if(mag>.12){
    const dash=inp.dash&&!p.inGuest&&!(p.id==='cat'&&p.held.length);
    const sp=p.def.speed*(p.held.length?p.def.slow:1)*(dash?1.55:1)*(p.inGuest?.5:1)*Math.min(1,mag);
    const c=collide(p.x+ix*sp*dt,p.z+iz*sp*dt,.32);p.x=c[0];p.z=c[1];p.moving=sp;p.dashing=dash;p.rot=rotTo(p.rot,Math.atan2(ix,iz),dt*14);
  }
  const push=(o,R)=>{const d=dist(p.x,p.z,o.x,o.z);if(d<R&&d>1e-4){const c=collide(o.x+(p.x-o.x)/d*R,o.z+(p.z-o.z)/d*R,.32);p.x=c[0];p.z=c[1];}};
  for(const n of G.npcs)if(!n.gone)push(n,.6);
  for(const q of G.players)if(q!==p&&q.ctrl==='local')push(q,.55);
}
function checkTraps(p){
  for(let i=G.traps.length-1;i>=0;i--){const t=G.traps[i];
    if(p.stun<=0&&dist(p.x,p.z,t.x,t.z)<.5){p.stun=.9;drop(t.mesh);G.traps.splice(i,1);SFX.slip();toast(`${pTag(p)}${pTag(p)?'が':''}猫のおもちゃを踏んで転んだ`,'warn');emitNoise(p.x,p.z,2.5,p);rumble(p.ctrl==='local'?p.dev:'',300,.8);}}
}
function updatePlayerLocal(p,inp,dt){
  p.cd=Math.max(0,p.cd-dt);p.inGuest=calcInGuest(p);
  if(p.inGuest)hint('guest','来客に見られている間は走れない。笑顔でゆっくり通ろう','warn');
  moveLocal(p,inp,dt);if(p.stun>0)p.stun-=dt;
  if(p.dashing){p.noiseT-=dt;if(p.noiseT<=0){p.noiseT=.3;emitNoise(p.x,p.z,0,p);}}
  checkTraps(p);
  p.act=(p.stun>0||p.arguing)?null:findAction(p);
  if(inp.act&&p.act)p.act.fn();
  if(inp.skill&&p.cd<=0&&p.stun<=0)useSkill(p);
}
function updatePlayerRemote(p,dt){                             // host side: an online guest's player
  p.cd=Math.max(0,p.cd-dt);p.inGuest=calcInGuest(p);p.moving=0;p.dashing=false;
  if(p.inGuest)hint('guest','来客に見られている間は走れない。笑顔でゆっくり通ろう','warn');
  if(p.stun>0)p.stun-=dt;
  const g=NET.guests.find(x=>x.peer===p.peer),inp=g&&g.in;
  let as=p.actSeq,ss=p.skillSeq;
  if(inp&&inp[0]===G.gid){
    const x=num(inp[1],p.x),z=num(inp[2],p.z);
    if(p.stun<=0&&isFree(x,z,.2)){p.x=x;p.z=z;}
    p.rot=num(inp[3],p.rot);p.moving=clamp(num(inp[4]),0,12);p.dashing=!!inp[5]&&!p.inGuest&&p.moving>0;
    if(p.dashing){p.noiseT-=dt;if(p.noiseT<=0){p.noiseT=.3;emitNoise(p.x,p.z,0,p);}}
    as=num(inp[6])|0;ss=num(inp[7])|0;
  }
  checkTraps(p);
  p.act=(p.stun>0||p.arguing)?null:findAction(p);
  if(as>p.actSeq){p.actSeq=as;if(p.act)p.act.fn();}
  if(ss>p.skillSeq){p.skillSeq=ss;if(p.cd<=0&&p.stun<=0)useSkill(p);}
}
function findAction(p){
  const c=[],has=t=>p.held.some(h=>h.type===t),room=p.held.length<p.def.carry;
  const add=(x,z,range,prio,code,fn)=>{const d=dist(p.x,p.z,x,z);if(d<=range)c.push({s:d-prio,x,z,c:code,fn});};
  for(const n of G.fam){
    if(n.gone||n.id==='guest')continue;const me=n===p;
    if(n.arguing){if(!me)add(n.x,n.z,2.1,.8,0,()=>endArgue(n,p));continue;}
    if(n.req){const t=n.req.type;
      if(t==='beer'&&has('beer'))add(n.x,n.z,2.1,me?.1:.5,me?16:1,()=>{if(!n.req)return;takeItem(p,'beer');fulfil(n,p);});
      else if((t==='dish'||t==='breakfast')&&has('dish'))add(n.x,n.z,2.1,me?.1:.5,me?17:t==='dish'?2:3,()=>{if(!n.req)return;takeItem(p,'dish');fulfil(n,p);});
      else if(t==='pet'&&!me)add(n.x,n.z,1.5,.5,4,()=>fulfil(n,p));}
    if(n.state==='queue'&&!G.toilet.occ)add(n.x,n.z,1.7,.3,5,()=>{if(n.state==='queue'&&!G.toilet.occ)divert(n,p);});
  }
  if(G.guest&&has('dish'))add(G.guest.x,G.guest.z,2.3,.4,6,()=>{takeItem(p,'dish');const g=G.guest;tableDish(g.x+rand(-.6,.6),g.z-1.1-rand(0,.5));G.progress++;addHate(g,-8);task(p);gain(300,'main',g.x,g.z);SFX.main();});
  if(G.stage==='dinner'&&has('dish'))add(P.table.x,P.table.z,2.2,.2,7,()=>{takeItem(p,'dish');const k=G.progress,a=(k%6)*TAU/6+.4;tableDish(P.table.x+Math.cos(a)*.68,P.table.z+Math.sin(a)*.68,.47+Math.floor(k/6)*.07);G.progress++;task(p);gain(300,'main',P.table.x,P.table.z);SFX.main();});
  G.stoves.forEach(s=>{const fz=-5.75;
    if(s.state==='idle')add(s.x,fz,1.2,0,8,()=>{if(s.state!=='idle')return;s.state='cook';s.t=0;SFX.pick();});
    else if(s.state==='ready'&&room)add(s.x,fz,1.2,.2,9,()=>{if(s.state!=='ready')return;s.state='idle';giveItem(p,'dish');});
    else if(s.state==='burnt')add(s.x,fz,1.2,0,10,()=>{if(s.state!=='burnt')return;s.state='idle';SFX.pick();});});
  if(room&&G.usesBeer)add(P.fridge.x,-5.6,1.3,0,11,()=>giveItem(p,'beer'));
  if(G.routerDown)add(P.router.x,-1.1,1.2,.4,12,()=>{const n=G.fam.find(n=>n.req&&n.req.type==='router');if(n)fulfil(n,p);else G.routerDown=false;});
  if(room)for(const e of G.items)add(e.x,e.z,1.2,.3,13,()=>{if(!G.items.includes(e))return;removeEvidence(e);giveItem(p,'evidence',e.kind);});
  if(p.held.length)add(P.trash.x,P.trash.z,1.5,.1,has('evidence')?14:15,()=>{
    if(has('evidence')){takeItem(p,'evidence');task(p);gain(150,'sub',P.trash.x,P.trash.z);SFX.give();}else{p.held.pop();refreshHeld(p);SFX.pick();}});
  c.sort((a,b)=>a.s-b.s);return c[0]||null;
}
function divert(n,p){
  const q=G.wash.queue,i=q.indexOf(n);if(i>=0)q.splice(i,1);G.toilet.occ=n;n.state='toToilet';n.waitT=0;goTo(n,P.toilet.x,P.toilet.z);
  task(p);gain(100,'calm',n.x,n.z);SFX.give();toast(`${n.def.name}をトイレへ誘導した`);
}
function useSkill(p){
  p.cd=12;SFX.skill();let calmed=false;const live=G.fam.filter(n=>!n.gone&&n!==p),who=pTag(p)?pTag(p)+'の':'';
  rippleN(p.x,p.z,6,0x3fb58a);
  if(p.id==='bro'){live.forEach(n=>{if(n.hate>1)calmed=true;addHate(n,-18);});G.distract=4;toast(`${who}家電ハック。4秒間、センサー無効`);}
  else if(p.id==='mom'){if(p.held.length<p.def.carry)giveItem(p,'dish');live.forEach(n=>{if(dist(p.x,p.z,n.x,n.z)<4){if(n.hate>1)calmed=true;addHate(n,-30);}});toast(`${who}神速料理。できたてをどうぞ`);}
  else if(p.id==='sis'){live.forEach(n=>{if(!n.isPlayer)n.frozen=5;});toast(`${who}バズ動画。全員が5秒間スマホに釘付け`);calmed=true;}
  else if(p.id==='cat'){live.forEach(n=>{if(dist(p.x,p.z,n.x,n.z)<3.5){if(n.hate>1)calmed=true;addHate(n,-40);burst(n.x,1.4,n.z,'heart',5);}});toast(`${who}すりすり。近くの家族がとろけた`);}
  else{live.forEach(n=>{if(!n.isPlayer)n.frozen=3;if(n.arguing)endArgue(n,null);addHate(n,-8);});toast(`${who}一喝。「静かにせんか」`);calmed=true;}
  if(calmed){calmBy(p);gain(100,'calm',p.x,p.z);}
}

/* ---------- NPC behaviour (state machines) ---------- */
const BEHAVE={
  dad(){},
  bro(n,dt){
    if(n.state==='pc'){if(G.routerDown&&n.req&&n.req.t>14){n.state='storm';n.sit=false;goTo(n,P.router.x,-.9);toast('長男が部屋から出てきた。家族と鉢合わせる前に復旧を','warn');}}
    else if(n.state==='storm'){if(!G.routerDown){n.state='back';goTo(n,P.broSeat.x,P.broSeat.z);}else moveAlong(n,dt,2.1);}
    else if(n.state==='back'&&moveAlong(n,dt,n.def.npcSpeed)){n.state='pc';n.sit=true;n.rot=Math.PI;}
  },
  mom(n,dt){
    if(n.state==='patrol'){if(n.path){if(moveAlong(n,dt,n.def.npcSpeed))n.wait=rand(1.5,3.5);}else{n.wait-=dt;if(n.wait<=0){const w=pick(MOM_WP);goTo(n,w.x,w.z);}}}
    else if(n.state==='investigate'){if(moveAlong(n,dt,n.def.npcSpeed*1.5)){let best=null,bd=9;for(const e of G.items){const d=dist(n.x,n.z,e.x,e.z);if(d<bd){bd=d;best=e;}}
      if(best){n.state='search';n.target=best;goTo(n,best.x,best.z);toast('母が証拠品を捜索中','warn');}else{n.state='patrol';n.wait=2;}}}
    else if(n.state==='search'){if(!G.items.includes(n.target)){n.state='patrol';n.wait=1;n.path=null;return;}
      const arrived=moveAlong(n,dt,n.def.npcSpeed*1.4);if(arrived||dist(n.x,n.z,n.target.x,n.target.z)<.8){removeEvidence(n.target);addHate(n,22);gain(-50,'pen',n.x,n.z,'発見された');toast('母「これは何なの！？」','warn');SFX.bad();n.state='patrol';n.wait=2;n.path=null;}}
  },
  sis(n,dt){
    if(n.path){if(moveAlong(n,dt,n.def.npcSpeed))n.wait=rand(2,4.5);}
    else{n.wait-=dt;n.rot+=dt*.5;if(n.wait<=0){const pt=randPoint(inCommon);goTo(n,pt.x,pt.z);}}
  },
  cat(n,dt){
    if(n.path){if(moveAlong(n,dt,n.req?1.5:(n.fast?4.2:n.def.npcSpeed))){n.wait=rand(.6,2.5);n.fast=Math.random()<.5;}}
    else{n.wait-=dt;if(n.wait<=0){const pt=randPoint();goTo(n,pt.x,pt.z);}}
    n.mis-=dt;if(n.mis<=0){n.mis=rand(13,20);if(!blocked[cellAt(n.x,n.z)]){const sis=G.byId.sis,nearSis=sis&&!sis.isPlayer&&!sis.gone&&dist(n.x,n.z,sis.x,sis.z)<6;if(nearSis||Math.random()<.5)spawnTrap(n.x,n.z);else spawnEvidence(n.x,n.z);}}
  },
  guest(){}
};
const queueSlot=i=>({x:5.6-Math.min(i,3)*1.3,z:i===0?-1.1:-.5});
function toSeat(n){const s=P.seats[G.seatI++%4];n.seat=s;n.state='toSeat';goTo(n,s.x,s.z);}
function routine(n,dt){                                 // morning: wake → wash (1 at a time) → breakfast → leave
  const sp=n.def.npcSpeed*1.4;
  switch(n.state){
    case'sleep':if(G.time>=n.wakeAt){n.state='queue';n.waitT=0;n.slotI=-1;G.wash.queue.push(n);toast(`${n.def.name}が起きてきた`);}break;
    case'queue':{const q=G.wash.queue,i=q.indexOf(n);
      if(i===0&&!G.wash.occ){q.shift();G.wash.occ=n;n.state='toWash';goTo(n,P.wash.x,P.wash.z);break;}
      if(n.slotI!==i){n.slotI=i;const s=queueSlot(i);goTo(n,s.x,s.z);}
      if(n.path)moveAlong(n,dt,sp);else{n.waitT+=dt;if(n.waitT>3){addHate(n,2.6*G.hateMul*dt);hint('queue','洗面所が渋滞中。並んでいる家族に近づいて、空いているトイレへ誘導しよう','warn');}}
      break;}
    case'toWash':if(moveAlong(n,dt,sp)){n.state='wash';n.t=7;n.rot=Math.PI;}break;
    case'wash':n.t-=dt;if(n.t<=0){G.wash.occ=null;toSeat(n);}break;
    case'toToilet':if(moveAlong(n,dt,sp)){n.state='toilet';n.t=7;n.rot=Math.PI;}break;
    case'toilet':n.t-=dt;if(n.t<=0){G.toilet.occ=null;toSeat(n);}break;
    case'toSeat':if(moveAlong(n,dt,sp)){n.state='seated';n.sit=true;n.rot=Math.atan2(P.table.x-n.x,P.table.z-n.z);startReq(n,'breakfast');}break;
    case'seated':if(!n.req){n.state='eat';n.t=3.5;}break;
    case'eat':n.t-=dt;if(n.t<=0){n.sit=false;n.state='toDoor';n.nextReq=1e9;goTo(n,P.door.x,P.door.z);}break;
    case'toDoor':if(moveAlong(n,dt,sp)){n.gone=true;n.m.g.visible=false;G.progress++;task(null);gain(300,'main',n.x,n.z);SFX.main();toast(`${n.def.name}「いってきます」`);}break;
  }
}
function updateNpc(n,dt){
  n.moving=0;if(n.gone)return;
  n.hearCd=Math.max(0,n.hearCd-dt);n.ringFlash=Math.max(0,n.ringFlash-dt);
  if(n.frozen>0){n.frozen-=dt;return;}
  if(n.state!=='sleep')addHate(n,.15*G.hateMul*dt);
  if(n.arguing){n.argT+=dt;addHate(n,3.4*dt);const o=n.arguing;n.rot=rotTo(n.rot,Math.atan2(o.x-n.x,o.z-n.z),dt*8);if(n.argT>10)endArgue(n,null);return;}
  if(n.req){n.req.t+=dt;const late=n.req.t>n.req.pat;addHate(n,(late?4:1.4)*G.hateMul*dt);
    if(late&&!n.req.warned){n.req.warned=true;toast(`${n.def.name}が限界寸前。${REQ[n.req.type].text}を急げ`,'warn');SFX.alarm();}}
  else if(n.types.length&&G.time>=n.nextReq)startReq(n,pick(n.types));
  if(n.spotT>0)return;
  if(G.stage==='morning'&&n.id!=='cat')routine(n,dt);else BEHAVE[n.id](n,dt);
}

/* ---------- world systems ---------- */
function updateSystems(dt){
  G.distract=Math.max(0,G.distract-dt);
  G.stoves.forEach(s=>{
    if(s.state==='cook'){s.t+=dt;if(s.t>=G.cookT){s.state='ready';s.t=0;SFX.pick();}}
    else if(s.state==='ready'){s.t+=dt;if(s.t>=16){s.state='burnt';const v=G.fam.find(n=>n.id==='mom'&&!n.gone)||G.fam.find(n=>!n.gone&&n.id!=='cat'&&n.id!=='guest');if(v)addHate(v,10);toast('料理が焦げた。コンロを放置しすぎた','warn');SFX.bad();emitNoise(s.x,-5.8,2,null);}}
  });
  G.evT-=dt;
  if(G.evT<=0){G.evT=rand(16,26)*(G.stage==='dinner'?1:.85)/G.pace;const sis=G.byId.sis;

}
const cam={x:-3,z:3,d:20};
function updateCamera(dt){
  const asp=VW/VH,tanH=Math.tan(camera.fov*Math.PI/360),base=Math.max(13,(9.5/asp)/(2*tanH));let tx,tz,d=base;
  if(G.phase==='title'){const f=G.byId[G.titleFocus]||G.actors[0];d*=.62;tx=f.x+Math.sin(NOW*.3)*.4-(asp>1.2?d*.16:0);tz=f.z+(asp<1?d*.27:0);}
  else if(G.phase==='flip'){tx=P.table.x;tz=P.table.z+1;d*=.85;}
  else{const L=G.locals.length?G.locals:G.players;let sx=0,sz=0,spread=0;
    for(const p of L){sx+=p.x;sz+=p.z;for(const q of L)spread=Math.max(spread,dist(p.x,p.z,q.x,q.z));}
    tx=clamp(sx/L.length,-8,8);tz=clamp(sz/L.length,-5.5,5.5);d=Math.min(base*1.7,base+Math.max(0,spread-3)*.9);}
  const k=Math.min(1,dt*4);cam.x=lerp(cam.x,tx,k);cam.z=lerp(cam.z,tz,k);cam.d=lerp(cam.d,d,k);
  const sh=(G.camShake||0)*.5;
  camera.position.set(cam.x+rand(-sh,sh),cam.d*.82+rand(-sh,sh),cam.z+cam.d*.57);camera.lookAt(cam.x,0,cam.z);
}
const LB={els:[],n:0};

const heldIcon=h=>h.type==='dish'?'🍛':h.type==='beer'?'🍺':h.kind.emoji;
function updateHud(){
  if(G.phase!=='play'&&G.phase!=='clear')return;
  const s=Math.max(0,Math.ceil(G.timeLeft));setText('#timer',`${(s/60)|0}:${String(s%60).padStart(2,'0')}`);$('#timer').classList.toggle('low',s<=30);
  setText('#score',String(G.score));setText('#combo',G.combo>1&&G.time-G.lastGain<10?`団らんコンボ ×${G.combo}`:'');
  const pips=$('#pips').children;for(let i=0;i<pips.length;i++)pips[i].classList.toggle('on',i<G.progress);
  for(const n of G.fam){const c=n.chip,h=Math.round(n.hate),lv=n.gone?'gone':n.hate>=75?'d':n.hate>=50?'w':'';
    const icon=n.arguing?'💢':n.spotT>0?(n.id==='mom'?'👀':'📸'):n.req?REQ[n.req.type].icon:'';const text=n.gone?'出発済み':n.arguing?`${n.arguing.def.name}と口論中`:n.spotT>0?(n.id==='mom'?'証拠品に気づいた':'証拠品を撮影中'):n.req?REQ[n.req.type].text:n.state==='sleep'?'睡眠中':n.awk?'気まずい':'';
    const k=h+lv+icon+text;if(c.k===k)continue;c.k=k;c.pct.textContent=h+'%';c.bar.style.width=h+'%';c.el.className='chip '+lv;c.rq.textContent=icon;c.rt.textContent=text;}
  for(const p of G.locals){const c=p.card;if(!c)continue;const cd=Math.ceil(p.cd),k=p.heldKey+'|'+cd;if(c.k===k)continue;c.k=k;
    c.hd.textContent=p.held.length?p.held.map(heldIcon).join(''):'手ぶら';c.cd.textContent=cd>0?`${p.def.skill.name} ${cd}`:`${p.def.skill.name} OK`;c.cd.classList.toggle('wait',cd>0);}
  const p=G.player,sk=$('#btn-skill');sk.classList.toggle('cd',p.cd>0);setText('#skill-cd',p.cd>0?String(Math.ceil(p.cd)):'');
  const a=$('#btn-act');a.classList.toggle('idle',!p.act);setText('#act-name',p.act&&ACTS[p.act.c]?ACTS[p.act.c]:'行動');
  $('#btn-dash').classList.toggle('on',!!p.dashing);
}

function openRooms(){

  for(const p of peers){if(p.sameTab)continue;const h=p.presence&&p.presence.host;if(!h||typeof h!=='object')continue;
    const code=typeof h.c==='string'&&/^[a-z0-9]{4}$/.test(h.c)?h.c:null;if(!code)continue;
    out.push({code,n:clamp(num(h.n)|0,0,4),st:STAGES[h.st]?h.st:'dinner',pl:!!h.pl,ch:ORDER.includes(h.ch)?h.ch:''});}
  return out;
}

const KEYS={},EDGE=new Set(),TOUCH={jx:0,jz:0,dash:false};
const MOVE_KEYS=['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','ShiftLeft','KeyQ'];
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT'){if(e.code==='Enter'&&e.target.id==='room-code')$('#btn-joincode').click();return;}
  const inGame=G.phase==='play'||G.phase==='flip'||G.phase==='clear';
  if(inGame&&['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Slash','Period','Comma','Quote'].includes(e.code))e.preventDefault();
  if(MOVE_KEYS.includes(e.code))kbUsed=true;
  if(e.repeat)return;KEYS[e.code]=true;EDGE.add(e.code);
  if((e.code==='Escape'||e.code==='KeyP')&&G.phase==='play')setPause(!G.menu);
});
window.addEventListener('keyup',e=>{KEYS[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in KEYS)KEYS[k]=false;TOUCH.dash=false;});
window.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){kbUsed=true;document.body.classList.add('touch');}AU.wake();},true);
const press=(id,down,up)=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();down();});if(up){['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,up));}b.addEventListener('contextmenu',e=>e.preventDefault());};
press('#btn-act',()=>EDGE.add('TouchAct'));press('#btn-skill',()=>EDGE.add('TouchSkill'));press('#btn-dash',()=>{TOUCH.dash=true;},()=>{TOUCH.dash=false;});
const joy=$('#joy'),jbase=$('#joy-base'),jknob=$('#joy-knob');let jid=null,jox=0,joy0=0;
joy.addEventListener('pointerdown',e=>{if(jid!==null)return;jid=e.pointerId;try{joy.setPointerCapture(jid);}catch(_){}const r=joy.getBoundingClientRect();jox=e.clientX;joy0=e.clientY;jbase.style.left=(e.clientX-r.left-56)+'px';jbase.style.bottom='auto';jbase.style.top=(e.clientY-r.top-56)+'px';e.preventDefault();});
joy.addEventListener('pointermove',e=>{if(e.pointerId!==jid)return;let dx=e.clientX-jox,dy=e.clientY-joy0;const d=Math.hypot(dx,dy),R=48;if(d>R){dx*=R/d;dy*=R/d;}TOUCH.jx=dx/R;TOUCH.jz=dy/R;jknob.style.transform=`translate(${dx}px,${dy}px)`;});
const jend=e=>{if(e.pointerId!==jid)return;jid=null;TOUCH.jx=TOUCH.jz=0;jknob.style.transform='';};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
if(window.matchMedia&&matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');

const PADS={cur:[],prev:[],dir:[],dirPrev:[]};
function pollPads(){
  let list=[];try{list=navigator.getGamepads?navigator.getGamepads()||[]:[];}catch(e){list=[];}
  for(let i=0;i<4;i++){const pad=list[i];PADS.prev[i]=PADS.cur[i];PADS.dirPrev[i]=PADS.dir[i];
    if(pad&&pad.connected!==false){const b=[];for(let k=0;k<17;k++){const bt=pad.buttons&&pad.buttons[k];b.push(!!bt&&(bt.pressed||bt.value>.5));}
      const ax=[num(pad.axes&&pad.axes[0]),num(pad.axes&&pad.axes[1])];PADS.cur[i]={ax,b,pad};
      PADS.dir[i]=b[14]||ax[0]<-.6?'L':b[15]||ax[0]>.6?'R':b[12]||ax[1]<-.6?'U':b[13]||ax[1]>.6?'D':'';}
    else{PADS.cur[i]=null;PADS.dir[i]='';}}
}
const padEdge=(i,k)=>!!(PADS.cur[i]&&PADS.cur[i].b[k]&&!(PADS.prev[i]&&PADS.prev[i].b[k]));
const padDir=i=>PADS.dir[i]&&PADS.dir[i]!==PADS.dirPrev[i]?PADS.dir[i]:'';
window.addEventListener('gamepadconnected',e=>{if(G.phase==='title'&&e.gamepad&&e.gamepad.index<4)note(`コントローラー${e.gamepad.index+1}を検出しました。Aボタンで参加できます`);});
const axis=(neg,pos)=>(KEYS[pos]?1:0)-(KEYS[neg]?1:0);
const kb2On=()=>G.locals&&G.locals.some(p=>p.dev==='kb2');
function devInput(dev){
  if(HOOK.input){const h=HOOK.input(dev);if(h)return h;}
  const o={x:0,z:0,dash:false,act:false,skill:false};
  if(dev==='kb'){const two=kb2On();
    o.x=axis('KeyA','KeyD');o.z=axis('KeyW','KeyS');
    if(!two){o.x=o.x||axis('ArrowLeft','ArrowRight');o.z=o.z||axis('ArrowUp','ArrowDown');}
    if(Math.hypot(TOUCH.jx,TOUCH.jz)>.15){o.x=TOUCH.jx;o.z=TOUCH.jz;}
    o.dash=!!(KEYS.ShiftLeft||(!two&&KEYS.ShiftRight)||TOUCH.dash);
    o.act=EDGE.has('Space')||EDGE.has('KeyE')||(!two&&EDGE.has('Enter'))||EDGE.has('TouchAct');
    o.skill=EDGE.has('KeyQ')||EDGE.has('TouchSkill');
  }else if(dev==='kb2'){
    o.x=axis('ArrowLeft','ArrowRight');o.z=axis('ArrowUp','ArrowDown');o.dash=!!(KEYS.Slash||KEYS.ShiftRight);
    o.act=EDGE.has('Period')||EDGE.has('Enter')||EDGE.has('NumpadEnter');o.skill=EDGE.has('Comma');
  }else{const i=+dev.slice(1),s=PADS.cur[i];if(!s)return o;
    let x=s.ax[0],z=s.ax[1];if(Math.hypot(x,z)<.2){x=0;z=0;}
    if(s.b[14])x=-1;if(s.b[15])x=1;if(s.b[12])z=-1;if(s.b[13])z=1;
    o.x=x;o.z=z;o.dash=!!(s.b[1]||s.b[5]||s.b[7]||s.b[10]);o.act=padEdge(i,0);o.skill=padEdge(i,2)||padEdge(i,3);}
  return o;
}
function titleInput(){
  for(let i=0;i<4;i++){if(!PADS.cur[i])continue;const dev='p'+i;let li=PARTY.findIndex(p=>p.dev===dev);
    if(padEdge(i,0)&&li<0){joinLocal(dev);continue;}
    if(padEdge(i,1)&&li>=0&&NET.mode!=='guest'){leaveLocal(li);continue;}

   The host's screen runs the whole simulation. Each guest moves its own
   player locally and sends position + button counters in its presence;

const CONFIG={
  server:'',       // 例: 'wss://example.onrender.com/ws'  空なら、このページを配信したサーバーの /ws を試す
  peerjs:'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',

function relayRoom(name,meFn,sendPres,onLeave){              // a room object with the same calls the game uses on Claude rooms
  let mine={},snap=null,pend=null,closed=false;const others=new Map();
  return{name,custom:true,
    presence(patch){if(closed)return Promise.reject({code:'invalid_argument'});const next=Object.assign({},mine);
      for(const k in patch){if(patch[k]===null)delete next[k];else next[k]=patch[k];}
      if(ENC.encode(JSON.stringify(next)).length>4096)return Promise.reject({code:'invalid_argument'});
      mine=next;snap=null;if(!pend)pend=setTimeout(()=>{pend=null;if(!closed)sendPres(mine);},33);return Promise.resolve();},
    peers(){if(!snap){snap=[{peer:meFn(),sameTab:true,isMe:true,presence:mine}];others.forEach((p,k)=>snap.push({peer:k,sameTab:false,isMe:false,presence:p}));}return snap;},
    onPeers(){return()=>{};},
    connected(){return!closed;},
    leave(){if(!closed){closed=true;clearTimeout(pend);onLeave();}return Promise.resolve();},
    _set(peer,p){if(peer===meFn()||typeof peer!=='string')return;others.set(peer.slice(0,64),p&&typeof p==='object'&&!Array.isArray(p)?p:{});snap=null;},
    _del(peer){others.delete(peer);snap=null;},
    _closed(){closed=true;others.clear();snap=null;}};
}
function wsTransport(url){
  return new Promise(res=>{let ws,me='',done=false;const rooms=new Map();
    try{ws=new WebSocket(url);}catch(e){res(null);return;}
    const finish=v=>{if(!done){done=true;clearTimeout(to);res(v);}};
    const to=setTimeout(()=>{try{ws.close();}catch(e){}finish(null);},3500);
    const send=o=>{if(ws.readyState===1)ws.send(JSON.stringify(o));};
    const api={kind:'ws',join(name,opts){return new Promise((ok,ng)=>{
      if(ws.readyState!==1){ng(new Error('closed'));return;}
      const r=relayRoom(name,()=>me,pres=>send({t:'p',room:name,presence:pres}),()=>{send({t:'leave',room:name});rooms.delete(name);});
      r._ok=()=>ok(r);r._err=c=>{rooms.delete(name);ng(new Error(c));};rooms.set(name,r);send({t:'join',room:name,host:!!(opts&&opts.host)});
      setTimeout(()=>{if(rooms.get(name)===r&&!r._joined)r._err('timeout');},8000);});}};
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}if(!m||typeof m!=='object')return;
      if(m.t==='you'&&typeof m.peer==='string'){me=m.peer;finish(api);return;}
      const r=rooms.get(m.room);if(!r)return;
      if(m.t==='joined'){r._joined=true;r._ok();}else if(m.t==='err')r._err(String(m.code));else if(m.t==='p')r._set(m.peer,m.presence);else if(m.t==='bye')r._del(m.peer);};
    ws.onclose=()=>{rooms.forEach(r=>r._closed());rooms.clear();api.dead=true;finish(null);};
    ws.onerror=()=>{};
  });
}
function loadPeerJs(){
  const get=()=>window.Peer||(window.peerjs&&window.peerjs.Peer);
  if(get())return Promise.resolve(get());
  return new Promise(res=>{const sc=document.createElement('script');sc.src=CONFIG.peerjs;sc.async=true;
    const to=setTimeout(()=>res(null),8000);sc.onload=()=>{clearTimeout(to);res(get()||null);};sc.onerror=()=>{clearTimeout(to);res(null);};document.head.appendChild(sc);});
}
const P2P_PREFIX='opdanran-v1-';
function peerOpts(){const o={debug:0};if(CONFIG.ice)o.config={iceServers:CONFIG.ice};return o;}
function p2pHost(Peer,name){                                      // the host's browser is the hub every guest connects to
  return new Promise((ok,ng)=>{const id=P2P_PREFIX+name;let peer,opened=false;const conns=new Map();
    try{peer=new Peer(id,peerOpts());}catch(e){ng(e);return;}
    const bcast=(o,except)=>conns.forEach((c,k)=>{if(k!==except&&c.open)try{c.send(o);}catch(e){}});
    const r=relayRoom(name,()=>id,pres=>bcast({t:'p',peer:id,presence:pres}),()=>{conns.forEach(c=>{try{c.close();}catch(e){}});try{peer.destroy();}catch(e){}});
    peer.on('open',()=>{opened=true;ok(r);});
    peer.on('error',e=>{if(!opened){try{peer.destroy();}catch(_){}ng(new Error(e&&e.type==='unavailable-id'?'taken':'p2p'));}});
    peer.on('disconnected',()=>{if(!peer.destroyed)try{peer.reconnect();}catch(e){}});
    peer.on('connection',c=>{
      c.on('open',()=>{if(conns.size>=7){try{c.send({t:'err',code:'full'});}catch(e){}setTimeout(()=>c.close(),300);return;}
        conns.set(c.peer,c);try{c.send({t:'joined'});for(const p of r.peers())c.send({t:'p',peer:p.peer,presence:p.presence});}catch(e){}});
      c.on('data',m=>{if(!m||typeof m!=='object'||m.t!=='p'||!conns.has(c.peer))return;const pr=m.presence;
        if(!pr||typeof pr!=='object'||ENC.encode(JSON.stringify(pr)).length>4096)return;r._set(c.peer,pr);bcast({t:'p',peer:c.peer,presence:pr},c.peer);});
      c.on('close',()=>{if(conns.delete(c.peer)){r._del(c.peer);bcast({t:'bye',peer:c.peer});}});
      c.on('error',()=>{});});
  });
}
function p2pGuest(Peer,name){
  return new Promise((ok,ng)=>{let peer,conn=null,settled=false;
    try{peer=new Peer(peerOpts());}catch(e){ng(e);return;}
    const fail=code=>{if(settled)return;settled=true;try{peer.destroy();}catch(_){}ng(new Error(code));};
    const r=relayRoom(name,()=>peer.id||'',pres=>{if(conn&&conn.open)try{conn.send({t:'p',presence:pres});}catch(e){}},()=>{try{peer.destroy();}catch(e){}});
    peer.on('open',()=>{conn=peer.connect(P2P_PREFIX+name,{serialization:'json',reliable:true});
      conn.on('data',m=>{if(!m||typeof m!=='object')return;
        if(m.t==='joined'){if(!settled){settled=true;ok(r);}}
        else if(m.t==='p'&&typeof m.peer==='string')r._set(m.peer,m.presence);
        else if(m.t==='bye'&&typeof m.peer==='string')r._del(m.peer);
        else if(m.t==='err')fail(String(m.code));});
      conn.on('close',()=>{r._closed();fail('closed');});conn.on('error',()=>{});});
    peer.on('error',e=>fail(e&&e.type==='peer-unavailable'?'nohost':'p2p'));
    setTimeout(()=>fail('timeout'),15000);
  });
}
async function netInit(){

  if(G.phase==='play'){
    const it=Array.isArray(g.it)?g.it.slice(0,6).filter(Array.isArray):[];
    rebuildList('itemKey',it,()=>{G.items.forEach(e=>drop(e.mesh));G.items=it.map(e=>{const kind=EVID[num(e[2])|0]||EVID[0],x=num(e[0]),z=num(e[1]),mesh=makeItem('evidence',kind);mesh.position.set(x,.02,z);mesh.rotation.y=(x*7+z*3)%TAU;scene.add(mesh);return{x,z,kind,mesh};});});
    const tr=Array.isArray(g.tr)?g.tr.slice(0,6).filter(Array.isArray):[];
    rebuildList('trapKey',tr,()=>{G.traps.forEach(e=>drop(e.mesh));G.traps=tr.map(e=>{const x=num(e[0]),z=num(e[1]),mesh=makeTrap();mesh.position.set(x,0,z);scene.add(mesh);return{x,z,mesh,t:40};});});
    const di=Array.isArray(g.di)?g.di.slice(0,16).filter(Array.isArray):[];
    rebuildList('dishKey',di,()=>{G.dishes.forEach(d=>drop(d));G.dishes=[];di.forEach(e=>tableDish(num(e[0]),num(e[1]),num(e[2],.47)));});
  }
  if(Array.isArray(g.sv))g.sv.forEach((s,i)=>{if(G.stoves[i]&&Array.isArray(s)){G.stoves[i].state=STOVE_ST[num(s[0])|0]||'idle';G.stoves[i].t=num(s[1]);}});
  if(Array.isArray(g.ev))for(const e of g.ev){if(!Array.isArray(e))continue;const id=num(e[0])|0;if(id<=NET.lastEv)continue;NET.lastEv=id;playEvent(e.slice(1));}
  if(Array.isArray(g.rs))G.rs=[num(g.rs[0])|0,num(g.rs[1],-1)|0];
  if(g.ph==='flip'&&G.phase==='play'){if(!G.rs)G.rs=[2,-1];flipVisual();}
  else if(g.ph==='clear'&&G.phase==='play'){G.bd.bonus=num(g.bn)|0;clearVisual();}
  else if(g.ph==='result'&&G.phase!=='result'&&g.res&&typeof g.res==='object'){if(!G.reason)G.reason=reasonText(G.rs);renderResult(g.res);}
}
function applyActor(a,t){
  if(!a||!Array.isArray(t))return;const local=a.ctrl==='local';
  if(!local){a.tx=num(t[0],a.x);a.tz=num(t[1],a.z);a.trot=num(t[2],a.rot);a.moving=clamp(num(t[3]),0,12);}
  a.hate=clamp(num(t[4]),0,100);const f=num(t[5])|0;
  a.sit=!!(f&1);const gone=!!(f&2);if(gone!==a.gone){a.gone=gone;a.m.g.visible=!gone;}
  a.frozen=f&4?1:0;const st=f&16?1:0;if(local&&st&&a.stun<=0)rumble(a.dev,300,.8);a.stun=st;a.inGuest=!!(f&32);if(!local)a.dashing=!!(f&64);a.awk=!!(f&128);a.ringFlash=f&256?.5:0;
  const rq=t[6];if(Array.isArray(rq)&&REQ_KEYS[rq[0]]){const type=REQ_KEYS[rq[0]];a.req={type,t:num(rq[1]),pat:REQ[type].pat*(a.isPlayer?1.25:1)};}else a.req=null;
  const ai=num(t[7],-1)|0;a.arguing=ai>=0&&G.actors[ai]&&G.actors[ai]!==a?G.actors[ai]:null;
  a.spotT=num(t[8]);const sc=num(t[9])|0;a.state=['mirror','sleep','wash','toilet','queue'][sc]||'mirror';a.t=num(t[10]);a.waitT=num(t[10]);a.path=null;
  const hk=typeof t[11]==='string'?t[11].slice(0,4):'';if(hk!==a.heldKey){a.held=parseHeld(hk);refreshHeld(a);}
  a.cd=num(t[12]);const ac=t[13];a.act=Array.isArray(ac)&&ACTS[ac[0]]?{c:ac[0]|0,x:num(ac[1]),z:num(ac[2])}:null;
}
function playEvent(e){
  const k=e[0];
  if(k==='s'&&typeof e[1]==='string'&&Object.prototype.hasOwnProperty.call(SFX_RAW,e[1]))SFX_RAW[e[1]]();
  else if(k==='t'&&typeof e[1]==='string')toastL(e[1].slice(0,80),e[2]==='warn'?'warn':'');
  else if(k==='f'&&typeof e[3]==='string')floatL(num(e[1]),num(e[2]),e[3].slice(0,24),e[4]==='bad'?'bad':'good');
  else if(k==='r')ripple(num(e[1]),num(e[2]),clamp(num(e[3],2),.5,8),num(e[4],0xffffff)&0xffffff);
  else if(k==='p'&&['heart','spark','steam','smoke','confetti'].includes(e[4])){const n=clamp(num(e[5],1)|0,1,12);for(let i=0;i<n;i++)puff(num(e[1]),num(e[2]),num(e[3]),e[4]);}
}

/* ================= main loop ================= */
function resize(){VW=cvs.clientWidth||window.innerWidth;VH=cvs.clientHeight||window.innerHeight;renderer.setSize(VW,VH,false);camera.aspect=VW/VH;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
function simStep(dt){                                             // offline and host
  if(G.phase==='play'&&!G.paused){
    G.time+=dt;G.timeLeft-=dt;
    for(const p of G.players){if(p.ctrl==='local')updatePlayerLocal(p,devInput(p.dev),dt);else updatePlayerRemote(p,dt);}
    if(G.multi)for(const p of G.players)updateHumanFam(p,dt);
    for(const n of G.npcs)updateNpc(n,dt);
    updateSystems(dt);if(G.phase==='play')checkEnd();
    BGM.update(dt,G.heat);
  }else if(G.phase==='flip')updateFlip(dt);
  else if(G.phase==='clear'){G.clearT+=dt;if(Math.random()<dt*20){const c=G.player;puff(c.x+rand(-3,3),2.5,c.z+rand(-3,3),'confetti');}if(G.clearT>2.6)showResult(true);}
}
function guestStep(dt){
  if(G.phase==='play'){
    G.time+=dt;G.timeLeft=Math.max(0,G.timeLeft-dt);
    for(const p of G.locals){const inp=devInput(p.dev);moveLocal(p,inp,dt);if(inp.act&&p.stun<=0)p.actSeq++;if(inp.skill&&p.cd<=0&&p.stun<=0)p.skillSeq++;}
    BGM.update(dt,G.heat);
  }
  if(G.phase==='play'||G.phase==='clear')for(const a of G.actors){if(a.ctrl==='local'||a.gone)continue;
    if(dist(a.x,a.z,a.tx,a.tz)>3){a.x=a.tx;a.z=a.tz;}else{const k=Math.min(1,dt*12);a.x=lerp(a.x,a.tx,k);a.z=lerp(a.z,a.tz,k);}a.rot=rotTo(a.rot,a.trot,dt*12);}
  if(G.phase==='flip')updateFlip(dt);
  else if(G.phase==='clear'){G.clearT+=dt;if(Math.random()<dt*20){const c=G.player;puff(c.x+rand(-3,3),2.5,c.z+rand(-3,3),'confetti');}}
}
function step(dt){
  NOW+=dt;pollPads();
  if(G.phase==='title')titleInput();
  else if(!overlayInput()&&G.phase==='play'){for(const p of G.locals)if(p.dev[0]==='p'&&padEdge(+p.dev.slice(1),9)){setPause(true);break;}}
  if(G.mode==='guest')guestStep(dt);else if(G.phase!=='title'&&G.phase!=='boot')simStep(dt);
  if(NET.mode==='host'&&NET.ch)hostTick();else if(NET.mode==='guest'&&NET.ch)guestTick();
  if(G.phase==='play'||G.phase==='clear')localTicks(dt);
  if(!(G.phase==='play'&&G.paused)){for(const a of G.actors)if(!a.gone)animActor(a,dt);updateFx(dt);}
  if(routerLed)routerLed.color.setHex(G.routerDown?(Math.sin(NOW*14)>0?0xff3b30:0x401010):0x3fff8a);
  if(tvScreen)tvScreen.color.setHSL((NOW*.07)%1,.5,.6);
  updateCamera(dt);drawLabels(dt);updateHud();
  EDGE.clear();
}
let last=0;
function tick(){const t=performance.now(),dt=Math.min(.05,(t-last)/1000||.016);last=t;step(dt);}
let lastFrame=0;
function frame(){lastFrame=performance.now();tick();renderer.render(scene,camera);requestAnimationFrame(frame);}
// Browsers slow or stop animation frames in background tabs; during online play a worker clock keeps the game running.
try{const w=new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),50)'],{type:'text/javascript'})));
  w.onmessage=()=>{if(NET.mode!=='off'&&performance.now()-lastFrame>200)tick();};}catch(e){}
buildWorld();resize();startTitle();netInit();
window.__danran={get G(){return G;},get PARTY(){return PARTY;},set PARTY(v){PARTY=v;},SEL,NET,HOOK,step,startGame,startTitle,tryStart,joinLocal,curSlots,createRoom,joinRoom,leaveRoom,openRooms,findPath,isFree};
requestAnimationFrame(frame);
})();
